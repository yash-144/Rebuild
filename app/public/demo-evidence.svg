<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Notebook paper background -->
  <rect width="800" height="600" fill="#fcfbf7" rx="12"/>
  <rect x="0" y="0" width="800" height="600" fill="none" stroke="#e2ded4" stroke-width="2" rx="12"/>
  
  <!-- Notebook margin red line -->
  <line x1="120" y1="0" x2="120" y2="600" stroke="#fca5a5" stroke-width="2"/>
  
  <!-- Notebook ruled lines -->
  <line x1="0" y1="60" x2="800" y2="60" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="0" y1="110" x2="800" y2="110" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="0" y1="160" x2="800" y2="160" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="0" y1="210" x2="800" y2="210" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="0" y1="260" x2="800" y2="260" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="0" y1="310" x2="800" y2="310" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="0" y1="410" x2="800" y2="410" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="0" y1="460" x2="800" y2="460" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="0" y1="510" x2="800" y2="510" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Team sample title -->
  <text x="140" y="48" font-family="'Comic Sans MS', 'Caveat', cursive, sans-serif" font-size="20" font-weight="bold" fill="#1e293b">
    Practice Attempt: Grouping by Category (Sample Notebook)
  </text>
  
  <!-- Handwritten notes & code sketch -->
  <text x="140" y="100" font-family="'Courier New', monospace" font-size="16" fill="#334155">
    // input: [{ category: "food", amount: 12 }, { category: "travel", amount: 8 }...]
  </text>
  
  <text x="140" y="150" font-family="'Courier New', monospace" font-size="16" fill="#0f172a">
    let totals = {};
  </text>
  
  <text x="140" y="200" font-family="'Courier New', monospace" font-size="16" fill="#0f172a">
    for (let i = 0; i &lt; expenses.length; i++) {
  </text>
  
  <text x="170" y="250" font-family="'Courier New', monospace" font-size="16" fill="#0f172a">
    let cat = expenses[i].category;
  </text>
  
  <text x="170" y="300" font-family="'Courier New', monospace" font-size="16" fill="#0f172a">
    let amt = expenses[i].amount;
  </text>
  
  <text x="170" y="350" font-family="'Courier New', monospace" font-size="16" fill="#2563eb">
    // stuck here: how to check if totals[cat] already exists?
  </text>
  
  <text x="170" y="400" font-family="'Courier New', monospace" font-size="16" fill="#0f172a">
    totals[cat] = (totals[cat] || 0) + amt;   // ?
  </text>
  
  <text x="140" y="450" font-family="'Courier New', monospace" font-size="16" fill="#0f172a">
    }
  </text>
  
  <text x="140" y="500" font-family="'Courier New', monospace" font-size="16" fill="#0f172a">
    return totals;
  </text>
  
  <!-- Stamp / badge -->
  <rect x="520" y="470" width="240" height="70" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="535" y="498" font-family="sans-serif" font-size="12" font-weight="bold" fill="#065f46">TEAM DEMO EVIDENCE PHOTO</text>
  <text x="535" y="522" font-family="sans-serif" font-size="11" fill="#047857">Fictional student notebook page</text>
</svg>
